<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" role="img" aria-labelledby="title desc">
  <title id="title">An undirected graph with a bridge and a cycle</title>
  <desc id="desc">Edges connect start to A, A to goal, goal to C, C to B, and B to A. The edge start-A is a bridge. A is an articulation point.</desc>
  <rect width="560" height="260" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="3">
    <path d="M80 70 H270 H460 V190 H270 V70"/>
  </g>
  <g fill="#eff6ff" stroke="#60a5fa" stroke-width="2">
    <circle cx="80" cy="70" r="32"/>
    <circle cx="270" cy="70" r="32"/>
    <circle cx="460" cy="70" r="32"/>
    <circle cx="270" cy="190" r="32"/>
    <circle cx="460" cy="190" r="32"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#172033" text-anchor="middle">
    <text x="80" y="77">start</text>
    <text x="270" y="77">A</text>
    <text x="460" y="77">goal</text>
    <text x="270" y="197">B</text>
    <text x="460" y="197">C</text>
  </g>
</svg>
